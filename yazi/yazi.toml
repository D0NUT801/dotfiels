[opener]
edit = [
    { run = 'nvim %s', block = true, for = "unix" },
]
play = [
    { run = 'mpv --vo=kitty %s', block = true, for = "unix" },
]
view = [
    { run = 'chafa -f symbols %s && read -n 1 -s -r', block = true, for = "unix" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "image/*", use = "view" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]


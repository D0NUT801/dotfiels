# shell
shell /usr/bin/zsh

# font
font_family        ComicShannsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          14.0

# windowing
window_padding_width    2
confirm_os_window_close 0
enable_audio_bell       no

# opacity
background_opacity 0.75

# Cursor
selection_background  #F7D2DB
selection_foreground  #4A2E35
url_color             #E06C9F
cursor_shape          block
cursor_blink_interval 0.5
cursor_trail          1
url_style curly
detect_urls yes

# --- Pastel Pink Light Theme ---
background           #fff0f5
foreground           #4a1c2d
selection_background #f2b6c9
selection_foreground #4a1c2d

# Cursor
cursor               #e65575
cursor_text_color    #fff0f5

# ANSI Colors (Optimized for high-contrast readability on a light background)
color0  #fff0f5
color1  #d94e72
color2  #7a63be
color3  #a86e32
color4  #cc4b7d
color5  #8a75d6
color6  #3a7bc8
color7  #4a1c2d

# Bright ANSI Colors (Used for TUI highlights and active selections)
color8  #d1b3be
color9  #b53657
color10 #5f48a3
color11 #8a5320
color12 #a8335f
color13 #6953b8
color14 #24589e
color15 #2b0f1a

# Tab Bar
tab_bar_edge bottom
tab_bar_align left
tab_bar_style powerline
tab_powerline_style angled
active_tab_foreground   #ffffff
active_tab_background   #e06c9f
inactive_tab_foreground #664d53
inactive_tab_background #f7d2db

# --- Mouse Copy/Paste Configuration ---
# Right-click to paste from clipboard
mouse_map right press ungrabbed paste_from_clipboard

# Select text with left click drag to auto-copy to clipboard
copy_on_select yes
